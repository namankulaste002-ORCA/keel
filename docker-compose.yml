version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  keel:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://keel:keel@postgres:5432/keel?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pg_data:
